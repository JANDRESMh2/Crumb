{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Login</h2>
    <p class="text-muted">Authenticate to access the Crumb system.</p>
    <hr>

    <!-- Mostrar mensajes de error (como credenciales inválidas) -->
    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="card p-4 shadow-sm" style="max-width: 500px;">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-3">
                <button type="submit" class="btn btn-primary" style="background-color: var(--primary);">Login</button>
                <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
        
        <div class="mt-4 pt-3 border-top">
            <small class="text-muted">Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></small>
        </div>
    </div>
</div>
{% endblock %}
