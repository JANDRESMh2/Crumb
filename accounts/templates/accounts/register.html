{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Register User</h2>
    <p>Create a new user account for the bakery administrators or staff.</p>

    <form method="POST">
        {% csrf_token %}
        <!-- Usamos el renderizado estándar o el partial field.html si lo prefieres[cite: 1] -->
        {{ form.as_p }}
        
        <div class="mt-3">
            <button type="submit" class="btn btn-primary" style="background-color: var(--primary);">Register User</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
