{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Register Stock-In (Ingredient Purchase)</h2>
    
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Stock-In</button>
            
            <a href="{% url 'inventory:list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
