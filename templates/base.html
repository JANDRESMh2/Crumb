<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Crumb{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23A8541D'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --surface-alt: #F4EDE2;
    --border: #E4D9C8;
    --text: #241D16;
    --muted: #756A5C;

    --primary: #A8541D;
    --primary-dark: #7E3E14;
    --primary-tint: rgba(168, 84, 29, 0.10);

    --success: #1F7A43;
    --success-bg: #E7F5EC;
    --warning: #8A6416;
    --warning-bg: #FBF1DD;
    --error: #A3271E;
    --error-bg: #FBEAE8;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(36, 29, 22, 0.06);
    --shadow-md: 0 10px 30px -12px rgba(36, 29, 22, 0.22);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(168, 84, 29, 0.06), transparent 45%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  header {
    background: rgba(250, 247, 242, 0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.05rem;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  nav { display: flex; gap: 1.75rem; }
  nav a {
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 0.2rem;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav a:hover { color: var(--primary-dark); border-color: var(--primary); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  main.wide { max-width: 920px; }

  .eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--primary);
    margin: 0 0 0.6rem;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }
  .lede {
    color: var(--muted);
    font-size: 1.02rem;
    margin: 0 0 2rem;
    max-width: 46ch;
    line-height: 1.5;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.25rem;
    box-shadow: var(--shadow-sm);
  }

  form .field { margin: 0 0 1.35rem; }
  form .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.35rem;
  }
  @media (max-width: 520px) {
    form .field-row { grid-template-columns: 1fr; gap: 0; }
  }
  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  label .required { color: var(--primary); margin-left: 0.15rem; }
  .form-control, .form-select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.98rem;
    font-family: var(--font-body);
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-control:focus, .form-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-tint);
  }
  .help { color: var(--muted); font-size: 0.8rem; margin: 0.35rem 0 0; }
  .field-error {
    color: var(--error);
    font-size: 0.8rem;
    margin: 0.35rem 0 0;
    font-weight: 600;
  }
  .form-errors {
    background: var(--error-bg);
    color: var(--error);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    margin: 0 0 1.5rem;
  }

  button, .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0.72rem 1.5rem;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover, .btn:hover { background: var(--primary-dark); }
  button:active, .btn:active { transform: translateY(1px); }
  .btn-secondary {
    background: transparent;
    color: var(--primary-dark);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface-alt); border-color: var(--primary); }

  .messages { list-style: none; margin: 0 0 1.75rem; padding: 0; }
  .messages li {
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    margin-bottom: 0.6rem;
    font-size: 0.88rem;
    font-weight: 500;
    border-left: 3px solid transparent;
  }
  .messages .success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .messages .warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
  .messages .error { background: var(--error-bg); color: var(--error); border-color: var(--error); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.75rem 0.6rem; font-size: 0.92rem; }
  thead th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-alt); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border-radius: 999px;
    padding: 0.3rem 0.55rem;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-badge-warning {
    background: var(--warning-bg);
    color: var(--warning);
  }
  .status-badge svg { flex-shrink: 0; }
  .status-empty { color: var(--muted); }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .empty-state svg { color: var(--border); margin-bottom: 1rem; }

  .actions { margin-top: 1.75rem; display: flex; gap: 0.85rem; flex-wrap: wrap; }

  dl.profile { display: grid; gap: 1.1rem; margin: 0; }
  dl.profile dt {
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }
  dl.profile dd { margin: 0.2rem 0 0; font-size: 1.08rem; }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-top: 2rem;
  }
  @media (max-width: 640px) {
    .card-grid { grid-template-columns: 1fr; }
  }
  .action-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 1.6rem;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .action-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--primary);
  }
  .action-card .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary-tint);
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .action-card h2 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    margin: 0 0 0.35rem;
  }
  .action-card p { color: var(--muted); font-size: 0.88rem; margin: 0; line-height: 1.45; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{% url 'home' %}">
    <span class="brand-mark">C</span>
    <span class="brand-name">Crumb</span>
  </a>
  <nav>
    <a href="{% url 'bakery:detail' %}">Bakery profile</a>
    <a href="{% url 'inventory:list' %}">Ingredients</a>
  </nav>
</header>
<main class="{% block main_class %}{% endblock %}">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
